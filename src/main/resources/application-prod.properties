# ============================================================
# PRODUCTION - APPLICATION.PROPERTIES
# ============================================================

# ============================================================
# SERVEUR
# ============================================================
server.port=${PORT:8080}

# ============================================================
# BASE DE DONNÉES - PostgreSQL (Render)
# ============================================================
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.generate_statistics=false

# ============================================================
# JWT
# ============================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=864000000

# ============================================================
# SPRING ACTUATOR - MONITORING
# ============================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.metrics.enable.all=true
management.info.build.enabled=true
management.info.env.enabled=true
management.info.java.enabled=true
management.health.probes.enabled=true
management.endpoint.prometheus.enabled=true

# ============================================================
# LOGS (moins bavards en production)
# ============================================================
logging.level.com.formation.usermanagement=INFO
logging.level.com.formation.usermanagement.aop=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.cache=INFO
logging.level.com.github.benmanes.caffeine=INFO
logging.level.org.springframework.aop=INFO