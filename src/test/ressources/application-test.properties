# =============================================
# H2 - Base de données de test
# =============================================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Afficher les requêtes SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# Logs Hibernate
# =============================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# =============================================
# Logs datasource
# =============================================
logging.level.com.zaxxer.hikari=DEBUG



# ============================================================
# SWAGGER / OPENAPI CONFIGURATION
# ============================================================

# Activer la documentation Swagger
springdoc.api-docs.enabled=true

# Activer l'interface Swagger UI
springdoc.swagger-ui.enabled=true

# Chemin pour la documentation JSON
springdoc.api-docs.path=/v3/api-docs

# Chemin pour l'interface Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Trier les endpoints par ordre alphabétique
springdoc.swagger-ui.tags-sorter=alpha

# Trier les opérations par ordre alphabétique
springdoc.swagger-ui.operations-sorter=alpha

# Afficher les modèles (DTOs) dans la documentation
springdoc.swagger-ui.default-models-expand-depth=1